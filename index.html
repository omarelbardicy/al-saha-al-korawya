<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الساحة الكروية">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style><title>الساحة الكروية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: one-column phone app on a mowed-pitch ground; sticky scoreboard on top, one screen per game mode */
:root{
  --pitch:#0b2418; --pitch-2:#0e2c1e; --card:#133524; --card-2:#184330;
  --chalk:#eef5ee; --muted:#9fb8a7; --line:#2b5a41;
  --flood:#f4d35e; --flood-ink:#1d1a05;
  --t1:#ff6b5e; --t2:#55c4ff; --ok:#5fdc8a; --bad:#ff7a7a;
  --display:"Lalezar","Tajawal",system-ui,sans-serif;
  --body:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--pitch);color:var(--chalk);font-family:var(--body);font-size:17px;line-height:1.55;
  background-image:repeating-linear-gradient(180deg,var(--pitch) 0 64px,var(--pitch-2) 64px 128px);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--pitch)}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--flood);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* scoreboard */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-left,0px));background:rgba(8,28,18,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.sc{display:flex;align-items:center;gap:8px;min-width:0}
.sc.b{flex-direction:row-reverse}
.sc .nm{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sc .pt{font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums;min-width:1.4em;text-align:center;padding:4px 6px 0;border-radius:8px}
.sc.a .pt{background:color-mix(in srgb,var(--t1) 22%,transparent);color:var(--t1)}
.sc.b .pt{background:color-mix(in srgb,var(--t2) 22%,transparent);color:var(--t2)}
.pt.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.35)}}
.homeBtn{background:var(--card-2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted)}

/* home */
.hero{text-align:center;padding:26px 0 8px;position:relative}
.hero .circle{width:120px;height:120px;border:3px solid var(--chalk);border-radius:50%;margin:0 auto -78px;opacity:.13}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(46px,13vw,68px);line-height:1.1;margin:0;color:var(--flood);text-shadow:0 3px 0 rgba(0,0,0,.35)}
.hero p{margin:4px 0 0;color:var(--muted);font-size:15px}
.sec{margin-top:22px}
.lab{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.02em;margin:0 0 8px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tin{background:var(--card);border-radius:14px;padding:10px;border-top:4px solid var(--t1)}
.tin.b{border-top-color:var(--t2)}
.tin input{width:100%;background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--chalk);font:700 16px var(--body);padding:4px 0;outline:none}
.tin .adj{display:flex;gap:6px;margin-top:8px;align-items:center;justify-content:space-between}
.tin .adj button{background:var(--card-2);border-radius:8px;width:38px;height:34px;font-weight:800;font-size:18px}
.tin .adj span{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--card);border-radius:16px;padding:14px 12px 12px;text-align:right;display:flex;flex-direction:column;gap:4px;min-height:118px;position:relative;overflow:hidden;border:1px solid var(--line)}
.mode:active{transform:scale(.98)}
.mode .no{font-family:var(--display);font-size:13px;color:var(--flood);opacity:.8}
.mode h3{margin:0;font-family:var(--display);font-weight:400;font-size:25px;line-height:1.15}
.mode p{margin:0;color:var(--muted);font-size:13px;line-height:1.4}
.mode .tm{position:absolute;left:10px;top:10px;font-size:12px;font-weight:800;background:var(--pitch);color:var(--flood);border-radius:999px;padding:2px 8px}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700}

/* game screens */
.head{padding:18px 0 6px}
.head h2{margin:0;font-family:var(--display);font-weight:400;font-size:38px;line-height:1.1;color:var(--flood)}
.head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.rules{background:var(--card);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--muted);margin-top:10px}
.rules b{color:var(--chalk)}
.card{background:var(--card);border-radius:18px;padding:16px;margin-top:14px;border:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 0;min-width:0}
.btn{background:var(--card-2);border-radius:14px;padding:14px 12px;font-weight:800;font-size:16px;line-height:1.3}
.btn.pri{background:var(--flood);color:var(--flood-ink)}
.btn.a{background:var(--t1);color:#2a0703}
.btn.b{background:var(--t2);color:#03202e}
.btn.ok{background:var(--ok);color:#06240f}
.btn.bad{background:color-mix(in srgb,var(--bad) 25%,var(--card-2));color:var(--chalk)}
.btn:disabled{opacity:.35;cursor:default}
.btn small{display:block;font-weight:500;font-size:12px;opacity:.8}
.big{font-family:var(--display);font-weight:400;font-size:clamp(36px,11vw,54px);line-height:1.15;text-align:center;margin:6px 0;text-wrap:balance}
.tag{display:inline-block;background:var(--pitch);color:var(--flood);font-size:13px;font-weight:800;border-radius:999px;padding:3px 10px}
.center{text-align:center}
.mut{color:var(--muted);font-size:14px}
.turn{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:16px;padding:10px;border-radius:12px;background:var(--pitch)}
.turn.a{color:var(--t1);box-shadow:inset 0 0 0 2px var(--t1)}
.turn.b{color:var(--t2);box-shadow:inset 0 0 0 2px var(--t2)}

/* timer */
.timer{display:flex;flex-direction:column;align-items:center;gap:6px}
.timer .num{font-family:var(--display);font-size:72px;line-height:1;font-variant-numeric:tabular-nums}
.timer .trk{width:100%;height:10px;border-radius:99px;background:var(--pitch);overflow:hidden}
.timer .fill{height:100%;background:var(--flood);width:100%;transition:width .1s linear}
.timer.warn .num{color:var(--bad)} .timer.warn .fill{background:var(--bad)}

/* clues */
.clue{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--pitch)}
.clue .n{font-family:var(--display);font-size:22px;color:var(--flood);width:26px;flex:none;text-align:center;line-height:1.2}
.clue.lock{color:var(--muted);opacity:.55}
.clue.new{animation:fadein .4s}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
.ans{background:var(--flood);color:var(--flood-ink);border-radius:12px;padding:10px;text-align:center;font-family:var(--display);font-size:30px}

/* lists */
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:10px;background:var(--pitch);border-radius:10px;padding:10px 12px;text-align:right;width:100%;min-height:48px}
.li .r{font-family:var(--display);font-size:20px;color:var(--flood);width:28px;flex:none;text-align:center}
.li .v{flex:1;min-width:0;font-weight:700}
.li .v .peek{color:var(--muted);font-weight:500;font-size:13px}
.li.done.a{background:color-mix(in srgb,var(--t1) 28%,var(--pitch))}
.li.done.b{background:color-mix(in srgb,var(--t2) 28%,var(--pitch))}
.li.done.x{background:var(--card-2);color:var(--muted)}
.li .who{font-size:12px;font-weight:800}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cols .li{padding:8px;font-size:14px;min-height:42px}
.cols .li .r{width:18px;font-size:15px}
.colh{font-family:var(--display);font-size:20px;text-align:center;padding:6px;border-radius:10px;margin-bottom:6px;line-height:1.2}
.colh small{display:block;font-family:var(--body);font-size:12px;font-weight:800}
.colh.a{background:color-mix(in srgb,var(--t1) 25%,transparent)} .colh.b{background:color-mix(in srgb,var(--t2) 25%,transparent)}
.dim{opacity:.45}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--muted);background:var(--pitch);border-radius:999px;padding:6px 12px;width:auto}
.toggle.on{color:var(--flood)}
.bidn{font-family:var(--display);font-size:84px;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.step{display:flex;justify-content:center;gap:12px;align-items:center}
.step button{width:56px;height:56px;border-radius:50%;background:var(--card-2);font-size:28px;font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--flood);color:var(--flood-ink);font-weight:800;padding:10px 18px;border-radius:999px;z-index:20;animation:fadein .25s;white-space:nowrap}
.confirm{background:var(--card-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="app" dir="rtl"></div>

<script>
/* ============================ البيانات ============================ */

// من أنا: 5 كلوز من الأصعب للأسهل
const WHO = [
 {a:"محمد صلاح",c:["في بدايته كان بيلعب ظهير شمال، وكان بيركب كذا مواصلة عشان يوصل التمرين","أول نادي أوروبي ليه كان في سويسرا","لعب لناديين في إيطاليا واحد منهم على سبيل الإعارة","نادي إنجليزي باعه بعد ما ملحقش ياخد فرصته","هداف الدوري الإنجليزي أكتر من مرة مع ليفربول"]},
 {a:"محمد أبوتريكة",c:["بدأ مسيرته في نادي الترسانة","سجل هدف الفوز في نهائي كأس أمم أفريقيا 2008","كشف عن تيشيرت مكتوب عليه تعاطفًا مع غزة بعد هدف","جاب ميدالية برونزية في كأس العالم للأندية 2006","لقبه الماجيكو وأمير القلوب"]},
 {a:"حسام حسن",c:["لعب في اليونان وسويسرا والإمارات","جاب هدف براسه في الجزاير سنة 89 أهّل مصر لكأس العالم 1990","انتقل من الأهلي للزمالك سنة 2000","عنده أخ توأم لعب معاه في كل حتة تقريبًا","بقى المدير الفني لمنتخب مصر"]},
 {a:"عصام الحضري",c:["بدأ في نادي دمياط","سافر لسيون السويسري وساب الأهلي من غير اتفاق","لعب للإسماعيلي والزمالك ووادي دجلة","أكبر لاعب يشارك في تاريخ كأس العالم","لقبه السد العالي"]},
 {a:"أحمد حسن",c:["بدأ في نادي أسوان وبعدين الإسماعيلي","لعب لـ4 أندية في تركيا آخرهم بشكتاش","لعب لأندرلخت البلجيكي","أكتر لاعب مصري لعب ماتشات دولية (184 ماتش)","كسب أمم أفريقيا 4 مرات وختم مسيرته بالأهلي والزمالك"]},
 {a:"ميدو",c:["أول احتراف ليه كان في جينت البلجيكي","لعب لسلتا فيجو ومارسيليا وروما","لعب لأياكس ورمى مقص على زلاتان بعد خناقة","لعب لتوتنهام في إنجلترا","مهاجم زملكاوي بقى مدرب ومحلل"]},
 {a:"شيكابالا",c:["أصله من أسوان","لعب لباوك اليوناني وهو صغير","لعب للوصل الإماراتي وسبورتنج لشبونة","بيلبس رقم 10 وكان كابتن","أسطورة الزمالك وقاعد فيه سنين طويلة"]},
 {a:"عمرو زكي",c:["بدأ في المنصورة وبعدين إنبي","لعب لفترة قصيرة في لوكوموتيف موسكو","لعب لهال سيتي في إنجلترا","تألق مع ويجان وكان في المنافسة على الهداف","لقبه البلدوزر"]},
 {a:"محمد زيدان",c:["احترف في الدنمارك وهو صغير","لعب لماينز 3 مرات","لعب لفيردر بريمن وهامبورج","جاب هدفين في البرازيل في كأس القارات 2009","بورسعيدي ولعب لدورتموند"]},
 {a:"تريزيجيه",c:["اتعار لموسكرون البلجيكي وهو في أندرلخت","لعب لقاسم باشا وباشاك شهير في تركيا","جاب هدف قاتل في الوقت بدل الضايع في ليستر ووصّل فريقه لنهائي كأس الرابطة","لعب لأستون فيلا وطرابزون سبور","جناح مصري طلع من الأهلي ورجع له في 2025"]},
 {a:"محمد النني",c:["طلع من أكاديمية الأهلي بس بدأ مع المقاولون العرب","لعب في بازل مع صلاح","اتعار لبشكتاش التركي","لعب للجزيرة الإماراتي","قعد سنين طويلة في أرسنال"]},
 {a:"عمر مرموش",c:["بدأ في وادي دجلة","اتعار لسانت باولي وشتوتجارت","انفجر مع آينتراخت فرانكفورت","انتقل لمانشستر سيتي في يناير 2025","جاب هاتريك في نيوكاسل"]},
 {a:"ليونيل ميسي",c:["أول نادي ليه كان اسمه جراندولي","أول هدف رسمي ليه كان لوب من تمريرة رونالدينيو","اتطرد بعد دقايق من نزوله في أول ماتش دولي","لعب في الدوري الأمريكي","عنده 8 كور ذهبية"]},
 {a:"كريستيانو رونالدو",c:["اتولد في جزيرة ماديرا","أول نادي ليه أندورينيا","اتباع بعد ماتش ودي ضد مانشستر يونايتد سنة 2003","لبس رقم 7 بعد بيكهام","برتغالي لعب للنصر السعودي"]},
 {a:"زين الدين زيدان",c:["أصله من منطقة القبائل في الجزاير","أول نادي محترف ليه كان كان (Cannes)","لعب لبوردو قبل ما يروح إيطاليا","جاب هدفين براسه في نهائي كأس العالم 98","نطح ماتيراتزي في نهائي 2006"]},
 {a:"رونالدينيو",c:["بدأ في جريميو","اتسجن في باراجواي بسبب جواز سفر مزور","جمهور البرنابيو صقف له في 2005","لعب لباريس وميلان","ساحر برشلونة والضحكة المشهورة"]},
 {a:"رونالدو البرازيلي",c:["كان في قايمة البرازيل اللي كسبت كأس العالم 94 ومالعبش ولا دقيقة","لعب لكروزيرو وآيندهوفن","لعب للإنتر وميلان، وبرشلونة وريال مدريد","تعب قبل نهائي كأس العالم 98","جاب هدفين في نهائي 2002 بقصة شعر مشهورة"]},
 {a:"تيري هنري",c:["بدأ في موناكو مع فينجر","قعد شهور في يوفنتوس وماعرفش يثبت","لعب في نيويورك ريد بولز","لمس الكورة بإيده قدام أيرلندا في تصفيات 2010","الهداف التاريخي لأرسنال"]},
 {a:"ديدييه دروجبا",c:["احترف متأخر مع لومان وجانجون","لعب موسم واحد مع مارسيليا","لعب في الصين وجالطة سراي","ساهم في وقف حرب أهلية في بلده","جاب هدف التعادل والضربة الأخيرة في نهائي 2012 لتشيلسي"]},
 {a:"أندريا بيرلو",c:["بدأ في بريشيا","لعب للإنتر قبل ميلان","لعب لنيويورك سيتي آخر مسيرته","شاط بانينكا قدام إنجلترا في يورو 2012","المايسترو بتاع ميلان ويوفنتوس"]},
 {a:"زلاتان إبراهيموفيتش",c:["اتمرن تايكوندو وهو صغير","بدأ في مالمو","لعب لأياكس ويوفنتوس والإنتر وبرشلونة","جاب مقصية من 30 متر في إنجلترا وخد جايزة بوشكاش","سويدي بيتكلم عن نفسه بصيغة الغايب"]},
 {a:"لوكا مودريتش",c:["عاش طفولته لاجئ أثناء حرب البلقان","اتعار لنادي في البوسنة وهو صغير","لعب لدينامو زغرب وتوتنهام","كسر احتكار ميسي ورونالدو للكورة الدهب","لاعب وسط ريال مدريد الكرواتي"]},
 {a:"ساديو ماني",c:["من قرية اسمها بامبالي","لعب لميتز الفرنسي وريد بول سالزبورج","جاب أسرع هاتريك في تاريخ البريمرليج","لعب لبايرن ميونخ موسم واحد","كان ضلع في تلاتي ليفربول مع صلاح"]},
 {a:"رياض محرز",c:["اتولد في سارسيل في فرنسا","لعب للوهافر","ليستر اشتراه بحوالي 400 ألف جنيه إسترليني","جاب فري كيك في نيجيريا في نص نهائي أمم 2019","جزايري لعب لمانشستر سيتي"]},
 {a:"أشرف حكيمي",c:["اتولد في مدريد","اتعار لدورتموند من ريال مدريد","لعب للإنتر وخد الدوري","شاط بانينكا قدام إسبانيا في كأس العالم 2022","ظهير المغرب وباريس"]},
 {a:"فيرجيل فان دايك",c:["كان بيغسل أطباق في مطعم وهو صغير","بدأ في جرونينجن","لعب لسلتيك الإسكتلندي","كان أغلى مدافع في العالم لما اتباع من ساوثهامبتون","كابتن ليفربول الهولندي"]},
 {a:"كيليان مبابي",c:["اتربى في ضاحية بوندي","بدأ مع موناكو","جاب هاتريك في نهائي كأس العالم وخسر","احتفاله المشهور إيده متكتفة","انتقل لريال مدريد 2024"]},

/* ============================ الحالة ============================ */
const KEY="saha-kora-v1";
let S={teams:[{name:"الفريق الأحمر",score:0},{name:"الفريق الأزرق",score:0}],used:{},eye:false};
try{const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.teams) S={...S,...s};}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tn=i=>esc(S.teams[i].name);
const ab=i=>i===0?"a":"b";
const AR="٠١٢٣٤٥٦٧٨٩"; const ar=n=>String(n).replace(/\d/g,d=>AR[d]);

function pick(mode,arr){
  let u=S.used[mode]||[];
  let free=arr.map((_,i)=>i).filter(i=>!u.includes(i));
  if(!free.length){u=[];free=arr.map((_,i)=>i);toast("خلصنا كل الأسئلة، هنبدأ من الأول");}
  const i=free[Math.random()*free.length|0]; u.push(i); S.used[mode]=u; save(); return arr[i];
}
function left(mode,arr){return arr.length-(S.used[mode]||[]).length}

function addPts(i,p){S.teams[i].score+=p;save();renderBar(i);if(p>0){toast(`+${ar(p)} لـ ${S.teams[i].name}`);tone(880,.12);setTimeout(()=>tone(1320,.18),120);}}

/* ============================ صوت وتايمر ============================ */
let AC=null;
function tone(f,d,type="square",vol=.12){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d+.02);}catch(e){}}
function whistle(){tone(2100,.25,"sine",.2);setTimeout(()=>tone(2100,.6,"sine",.2),300);try{navigator.vibrate&&navigator.vibrate([200,80,300])}catch(e){}}
let wake=null;
async function keepAwake(){try{if(!wake&&navigator.wakeLock)wake=await navigator.wakeLock.request("screen");wake&&wake.addEventListener("release",()=>wake=null);}catch(e){}}

let TM=null;
function stopTimer(){if(TM){clearInterval(TM.id);TM=null;}}
function timerHTML(sec){return `<div class="timer" id="tm"><div class="num">${ar(sec)}</div><div class="trk"><div class="fill"></div></div></div>`}
function startTimer(sec,onEnd){
  stopTimer();keepAwake();tone(660,.1);
  const end=Date.now()+sec*1000;let lastS=sec;
  const tick=()=>{
    const el=document.getElementById("tm"); if(!el){stopTimer();return;}
    const ms=Math.max(0,end-Date.now()), s=Math.ceil(ms/1000);
    el.querySelector(".num").textContent=ar(s);
    el.querySelector(".fill").style.width=(ms/(sec*1000)*100)+"%";
    el.classList.toggle("warn",s<=5);
    if(s!==lastS){lastS=s;if(s<=5&&s>0)tone(990,.08);}
    if(ms<=0){stopTimer();whistle();onEnd&&onEnd();}
  };
  TM={id:setInterval(tick,100)};tick();
}

let toastT;
function toast(msg){document.querySelectorAll(".toast").forEach(t=>t.remove());const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),1600);}

/* ============================ الهيكل ============================ */
function bar(){return `<div class="bar" id="bar">
  <div class="sc a"><span class="pt" id="p0">${ar(S.teams[0].score)}</span><span class="nm">${tn(0)}</span></div>
  <button class="homeBtn" data-go="home">الرئيسية</button>
  <div class="sc b"><span class="pt" id="p1">${ar(S.teams[1].score)}</span><span class="nm">${tn(1)}</span></div></div>`}
function renderBar(pop){const b=document.getElementById("bar");if(!b)return;b.outerHTML=bar();if(pop!=null){const e=document.getElementById("p"+pop);e&&e.classList.add("pop");}}
function screen(html){app.innerHTML=bar()+html;window.scrollTo(0,0);}
function head(t,sub,rules){return `<div class="head"><h2>${t}</h2>${sub?`<p>${sub}</p>`:""}</div>${rules?`<div class="rules">${rules}</div>`:""}`}
function eyeBtn(){return `<button class="toggle ${S.eye?"on":""}" data-eye>${S.eye?"عين الحكم: شغالة":"عين الحكم: مقفولة"}</button>`}

app.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){stopTimer();go(g.dataset.go);return;}
  const ey=e.target.closest("[data-eye]"); if(ey){S.eye=!S.eye;save();CUR&&CUR.render();return;}
});

  <div class="sec"><p class="lab">الفرق</p><div class="teams">

  </div></div>
  <div class="sec"><p class="lab">اختار الفقرة</p><div class="modes">
   ${MODES.map((m,k)=>`<button class="mode" data-go="${m.id}"><span class="tm">${m.tm}</span><span class="no">فقرة ${ar(k+1)}</span><h3>${m.h}</h3><p>${m.p}</p></button>`).join("")}

  [0,1].forEach(i=>{const inp=document.getElementById("tname"+i);inp.addEventListener("input",()=>{S.teams[i].name=inp.value.trim()||(i?"الفريق الأزرق":"الفريق الأحمر");save();});});
  app.querySelectorAll("[data-adj]").forEach(b=>b.onclick=()=>{const[i,d]=b.dataset.adj.split(",").map(Number);S.teams[i].score+=d;save();home();});

    const f=document.getElementById("foot");

    document.getElementById("yes").onclick=()=>{S.teams.forEach(t=>t.score=0);save();home();toast("النقط اتصفرت");};
    document.getElementById("no").onclick=home;
  };
  document.getElementById("resetUsed").onclick=()=>{S.used={};save();toast("كل الأسئلة رجعت");};
}

/* ============================ ١. مين أنا ============================ */
function Who(){

  CUR={render};
  function render(){
    const pts=6-st.n;
    screen(head("مين أنا؟",`فاضل ${ar(left("who",WHO))} لاعب`,"اقرا الكلوز بصوت عالي واحدة واحدة. أي فريق يعرف بدري ياخد نقط أكتر: <b>الكلو ١ = ٥ نقط</b> لحد <b>الكلو ٥ = نقطة</b>. التخمين الغلط يعدّي للكلو اللي بعده.")+
    `<div class="card stack">
      ${st.p.c.map((c,k)=>k<st.n||st.done?`<div class="clue ${k===st.n-1&&!st.done?"new":""}"><span class="n">${ar(k+1)}</span><span>${esc(c)}</span></div>`
        :`<div class="clue lock"><span class="n">${ar(k+1)}</span><span>الكلو مقفولة · ${ar(5-k)} ${5-k>2?"نقط":"نقطة"}</span></div>`).join("")}
      ${st.show||st.done?`<div class="ans">${esc(st.p.a)}</div>`:""}
    </div>
    <div class="card stack">
     ${st.done?`<button class="btn pri" id="nx">لاعب جديد</button>`:`
      <p class="center mut" style="margin:0">لو حد عرف دلوقتي ياخد <b style="color:var(--flood)">${ar(pts)}</b> ${pts>2?"نقط":"نقطة"}</p>
      <div class="row"><button class="btn a" data-w="0">${tn(0)} عرف</button><button class="btn b" data-w="1">${tn(1)} عرف</button></div>
      <div class="row">${st.n<5?`<button class="btn pri" id="more">الكلو اللي بعدها</button>`:`<button class="btn bad" id="none">محدش عرف</button>`}
       <button class="btn" id="peek">${st.show?"اخفي الإجابة":"الحكم يشوف الإجابة"}</button></div>`}
    </div>`);
    const $=id=>document.getElementById(id);
    $("more")&&($("more").onclick=()=>{st.n++;tone(520,.08);render();});
    $("peek")&&($("peek").onclick=()=>{st.show=!st.show;render();});
    $("none")&&($("none").onclick=()=>{st.done=true;render();});
    $("nx")&&($("nx").onclick=Who);
    app.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{addPts(+b.dataset.w,pts);st.done=true;render();});
  }
  render();
}

/* ============================ ٢. باسورد ============================ */
let passStarter=0;
function Pass(){
  const st={p:pick("pass",POOL),phase:"ready",turn:passStarter,words:0,winner:null};
  passStarter=1-passStarter;
  CUR={render};
  const value=()=>st.words<=2?3:st.words<=4?2:1;
  function render(){
    let body="";
    if(st.phase==="ready") body=`<div class="card stack center">
      <p style="margin:0">واحد من كل فريق ييجي يشوف اسم اللاعب، والباقيين يبصوا بعيد</p>
      <button class="btn pri" id="show">اعرض اللاعب</button></div>`;
    else if(st.phase==="show") body=`<div class="card stack center"><span class="tag">${esc(st.p.t)}</span><div class="big">${esc(st.p.n)}</div>
      <p class="mut" style="margin:0">يبدأ بالكلمة: <b style="color:var(--${st.turn?"t2":"t1"})">${tn(st.turn)}</b></p>
      <button class="btn pri" id="go">اخفي الاسم وابدأ ٣٠ ثانية</button></div>`;
    else if(st.phase==="play") body=`<div class="card stack">${timerHTML(30)}
      <div class="turn ${ab(st.turn)}">دور ${tn(st.turn)}: قول كلمة واحدة</div>
      <p class="center mut" style="margin:0">اتقال ${ar(st.words)} كلمة · لو حد عرف دلوقتي ياخد ${ar(value())}</p>
      <button class="btn pri" id="word">قال كلمته، الدور على التاني</button>
      <div class="row"><button class="btn a" data-w="0">${tn(0)} عرف</button><button class="btn b" data-w="1">${tn(1)} عرف</button></div>
      <button class="btn" id="peek">الحكم يشوف الاسم</button><div id="pk"></div></div>`;
    else body=`<div class="card stack center">${st.winner==null?`<p style="margin:0;font-weight:800;color:var(--bad)">الوقت خلص ومحدش عرف</p>`:`<p style="margin:0;font-weight:800;color:var(--ok)">${tn(st.winner)} عرف!</p>`}
      <div class="big">${esc(st.p.n)}</div><button class="btn pri" id="nx">لاعب جديد</button></div>`;
    screen(head("باسورد",`فاضل ${ar(left("pass",POOL))} لاعب`,"كل فريق بيقول <b>كلمة واحدة بس</b> بالدور لزميله. <b>ممنوع</b> تقول جنسيته، بلده، ناديه، أو اسم مدينة، ولا أي جزء من اسمه. عرفته في أول كلمتين = <b>٣ نقط</b>، تالت ورابع كلمة = <b>٢</b>، بعد كده = <b>١</b>.")+body);
    const $=id=>document.getElementById(id);
    $("show")&&($("show").onclick=()=>{st.phase="show";render();});
    $("go")&&($("go").onclick=()=>{st.phase="play";render();startTimer(30,()=>{st.phase="end";render();});});
    $("word")&&($("word").onclick=()=>{st.words++;st.turn=1-st.turn;tone(440,.06);const t=document.querySelector(".turn");t.className="turn "+ab(st.turn);t.textContent=`دور ${S.teams[st.turn].name}: قول كلمة واحدة`;t.nextElementSibling.textContent=`اتقال ${ar(st.words)} كلمة · لو حد عرف دلوقتي ياخد ${ar(value())}`;});
    $("peek")&&($("peek").onclick=()=>{const k=$("pk");k.innerHTML=k.innerHTML?"":`<div class="ans">${esc(st.p.n)}</div>`;});
    $("nx")&&($("nx").onclick=Pass);
    app.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{stopTimer();st.winner=+b.dataset.w;addPts(st.winner,value());st.phase="end";render();});
  }
  render();
}

/* ============================ ٣. تمثيل ============================ */
let actTurn=0;
function Act(){
  const team=actTurn; actTurn=1-actTurn;
  const st={p:pick("act",ACT),phase:"ready",ok:null};
  CUR={render};
  function render(){
    let body="";
    if(st.phase==="ready") body=`<div class="card stack center"><div class="turn ${ab(team)}">دور ${tn(team)}</div>
      <p style="margin:0">اللي هيمثل ييجي ياخد الموبايل لوحده</p><button class="btn pri" id="show">اعرض اللاعب</button></div>`;
    else if(st.phase==="show") body=`<div class="card stack center"><div class="big">${esc(st.p)}</div>
      <button class="btn pri" id="go">جاهز، ابدأ ٤٥ ثانية</button><button class="btn" id="swap">صعب أوي، هات غيره</button></div>`;
    else if(st.phase==="play") body=`<div class="card stack">${timerHTML(45)}<div class="turn ${ab(team)}">${tn(team)} بيخمّن</div>
      <button class="btn ok" id="yes">عرفوه! (+٢)</button><button class="btn bad" id="no">اتكلم أو استسلم</button></div>`;
    else body=`<div class="card stack center"><p style="margin:0;font-weight:800;color:var(--${st.ok?"ok":"bad"})">${st.ok?`${tn(team)} عرفه`:"معرفوش"}</p>
      <div class="big">${esc(st.p)}</div><button class="btn pri" id="nx">الدور على ${tn(1-team)}</button></div>`;
    screen(head("تمثيل لاعيبة",`فاضل ${ar(left("act",ACT))} اسم`,"واحد بيمثل اللاعب لفريقه <b>من غير ولا كلمة ولا صوت</b>. ينفع تقلد احتفاله، شكله، حركته المشهورة. الصح = <b>نقطتين</b>.")+body);
    const $=id=>document.getElementById(id);
    $("show")&&($("show").onclick=()=>{st.phase="show";render();});
    $("swap")&&($("swap").onclick=()=>{st.p=pick("act",ACT);render();});
    $("go")&&($("go").onclick=()=>{st.phase="play";render();startTimer(45,()=>{st.ok=false;st.phase="end";render();});});
    $("yes")&&($("yes").onclick=()=>{stopTimer();st.ok=true;addPts(team,2);st.phase="end";render();});
    $("no")&&($("no").onclick=()=>{stopTimer();st.ok=false;st.phase="end";render();});
    $("nx")&&($("nx").onclick=Act);
  }
  render();
}

/* ============================ ٤. المزاد ============================ */
function Bid(){
  const st={p:pick("bid",POOL),phase:"bid",n:12,max:20,holder:null,bid:null,q:0,show:false,ok:null};
  CUR={render};
  function render(){
    let body="";
    if(st.phase==="bid") body=`<div class="card stack center">
      <p class="mut" style="margin:0">اللاعب الجاي</p><div><span class="tag" style="font-size:16px">${esc(st.p.t)}</span></div>
      <p class="mut" style="margin:0">كام سؤال آه ولأ زميلك محتاج يعرفه في ٣٠ ثانية؟</p>
      <div class="step"><button id="plus" aria-label="زود">+</button><div class="bidn">${ar(st.n)}</div><button id="minus" aria-label="نقص">−</button></div>
      ${st.holder!=null?`<div class="turn ${ab(st.holder)}">آخر مزايدة: ${tn(st.holder)} على ${ar(st.bid)} سؤال</div>`:`<p class="mut" style="margin:0">لسه محدش زايد</p>`}
      <div class="row"><button class="btn a" data-b="0" ${st.holder===0?"disabled":""}>${tn(0)} يزايد<small>على ${ar(st.n)}</small></button><button class="btn b" data-b="1" ${st.holder===1?"disabled":""}>${tn(1)} يزايد<small>على ${ar(st.n)}</small></button></div>
      <button class="btn pri" id="lock" ${st.holder==null?"disabled":""}>قفل المزاد</button></div>`;
    else if(st.phase==="ready") body=`<div class="card stack center"><div class="turn ${ab(st.holder)}">${tn(st.holder)} كسب المزاد على ${ar(st.bid)} سؤال</div>
      <p style="margin:0">الفريق بيختار اللي هيعرف ويسأل، والحكم هو اللي بيرد آه أو لأ</p>
      <button class="btn" id="peek">${st.show?"اخفي الاسم":"الحكم يشوف الاسم"}</button>${st.show?`<div class="ans">${esc(st.p.n)}</div>`:""}
      <button class="btn pri" id="go">ابدأ ٣٠ ثانية</button></div>`;
    else if(st.phase==="play") body=`<div class="card stack">${timerHTML(30)}
      <div class="turn ${ab(st.holder)}">اتسأل ${ar(st.q)} من ${ar(st.bid)} سؤال</div>
      <button class="btn pri" id="q" ${st.q>=st.bid?"disabled":""}>${st.q>=st.bid?"الأسئلة خلصت، فاضل التخمين":"اتسأل سؤال"}</button>
      <div class="row"><button class="btn ok" id="yes">عرفه!</button><button class="btn bad" id="no">غلط / استسلم</button></div>
      <button class="btn" id="peek">${st.show?"اخفي الاسم":"الحكم يشوف الاسم"}</button>${st.show?`<div class="ans">${esc(st.p.n)}</div>`:""}</div>`;
    else body=`<div class="card stack center"><p style="margin:0;font-weight:800;color:var(--${st.ok?"ok":"bad"})">${st.ok?`${tn(st.holder)} كسب الرهان (+٣)`:`الرهان وقع، ${tn(1-st.holder)} ياخد ٣ نقط`}</p>
      <div class="big">${esc(st.p.n)}</div><button class="btn pri" id="nx">مزاد جديد</button></div>`;
    screen(head("المزاد",`فاضل ${ar(left("bid",POOL))} لاعب`,"الفريقين بيزايدوا بالدور: كل مزايدة لازم تبقى <b>أقل</b> من اللي قبلها. اللي يكسب المزاد زميله يسأل أسئلة <b>آه أو لأ</b> بس في <b>٣٠ ثانية</b>. عرفه = <b>٣ نقط</b> ليه، معرفوش = <b>٣ نقط</b> للفريق التاني.")+body);
    const $=id=>document.getElementById(id);
    $("plus")&&($("plus").onclick=()=>{if(st.n<st.max){st.n++;render();}});
    $("minus")&&($("minus").onclick=()=>{if(st.n>1){st.n--;render();}});
    app.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{
      if(st.bid!=null&&st.n>=st.bid){toast(`لازم أقل من ${ar(st.bid)}`);return;}
      st.holder=+b.dataset.b;st.bid=st.n;st.max=st.n-1;st.n=Math.max(1,st.n-1);tone(700,.08);
      if(st.bid===1){st.phase="ready";}
      render();});
    $("lock")&&($("lock").onclick=()=>{st.phase="ready";render();});
    $("peek")&&($("peek").onclick=()=>{st.show=!st.show;render();});
    $("go")&&($("go").onclick=()=>{st.phase="play";st.show=false;render();startTimer(30,()=>{st.ok=false;addPts(1-st.holder,3);st.phase="end";render();});});
    $("q")&&($("q").onclick=()=>{st.q++;tone(520,.06);const t=document.querySelector(".turn");t.textContent=`اتسأل ${ar(st.q)} من ${ar(st.bid)} سؤال`;if(st.q>=st.bid){$("q").disabled=true;$("q").textContent="الأسئلة خلصت، فاضل التخمين";}});
    $("yes")&&($("yes").onclick=()=>{stopTimer();st.ok=true;addPts(st.holder,3);st.phase="end";render();});
    $("no")&&($("no").onclick=()=>{stopTimer();st.ok=false;addPts(1-st.holder,3);st.phase="end";render();});
    $("nx")&&($("nx").onclick=Bid);
  }
  render();
}

/* ============================ ٥. توب ١٠ ============================ */
function Top(){
  const st={q:pick("top",TOP),turn:0,got:Array(10).fill(null),reveal:false};
  CUR={render};
  function render(){
    const doneN=st.got.filter(x=>x!=null).length, finished=doneN===10||st.reveal;
    screen(head("توب ١٠",`فاضل ${ar(left("top",TOP))} قايمة`,"الفريقين بيقولوا بالدور. الحكم يدوس على الإجابة الصح عشان تتكشف وياخد الفريق <b>نقطة</b> (والمركز بالظبط = <b>نقطتين</b>). غلط؟ الدور يروح للتاني. عندك <b>٢٠ ثانية</b> للإجابة.")+
    `<div class="card stack"><div class="big" style="font-size:clamp(26px,7.5vw,36px)">${esc(st.q.t)}</div>${st.q.n?`<p class="center mut" style="margin:0">${esc(st.q.n)}</p>`:""}
     ${finished?"":`<div class="turn ${ab(st.turn)}">الدور على ${tn(st.turn)}</div>${timerHTML(20)}
     <div class="row"><button class="btn pri" id="go">ابدأ ٢٠ ثانية</button><button class="btn bad" id="wrong">غلط، الدور يعدّي</button></div>`}
     <div class="row" style="justify-content:space-between;align-items:center">${eyeBtn()}<span class="mut" style="flex:none">اتعرف ${ar(doneN)} من ١٠</span></div>
     <div class="list">${st.q.i.map((v,k)=>{const g=st.got[k];const open=g!=null||st.reveal;
       return `<button class="li ${g!=null?"done "+(g===2?"x":ab(g)):""}" data-k="${k}" ${open?"disabled":""}><span class="r">${ar(k+1)}</span>
       <span class="v">${open?esc(v):S.eye?`<span class="peek">${esc(v)}</span>`:"؟"}</span>${g!=null&&g<2?`<span class="who">${tn(g)}</span>`:""}</button>`}).join("")}</div>
     <div class="row">${finished?`<button class="btn pri" id="nx">قايمة جديدة</button>`:`<button class="btn" id="all">اكشف الباقي</button>`}</div></div>`);
    const $=id=>document.getElementById(id);
    $("go")&&($("go").onclick=()=>startTimer(20,()=>{toast("الوقت خلص، الدور يعدّي");st.turn=1-st.turn;render();}));
    $("wrong")&&($("wrong").onclick=()=>{stopTimer();tone(200,.25,"sawtooth");st.turn=1-st.turn;render();});
    $("all")&&($("all").onclick=()=>{stopTimer();st.reveal=true;render();});
    $("nx")&&($("nx").onclick=Top);
    app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k; if(st.got[k]!=null)return;
      const list=b.closest(".list"); list.querySelectorAll(".pickrow").forEach(x=>x.remove());
      const row=document.createElement("div");row.className="row pickrow";
      row.innerHTML=`<button class="btn ok" data-r="1">في المركز ده بالظبط (+٢)</button><button class="btn" data-r="0">صح بس مركز تاني (+١)</button>`;
      b.after(row);
      row.querySelectorAll("[data-r]").forEach(r=>r.onclick=()=>{stopTimer();st.got[k]=st.turn;addPts(st.turn,r.dataset.r==="1"?2:1);st.turn=1-st.turn;render();});
    });
  }
  render();
}

/* ============================ ٦. سكورشيت ============================ */
function Xi(){
  const st={m:pick("xi",XI),phase:"side",side:0,turn:0,got:{a:Array(11).fill(false),b:Array(11).fill(false)},reveal:false,miss:[0,0]};
  CUR={render};
  // side=0 يعني الفريق الأحمر بياخد الفريق الأول من الماتش
  const sideOf=team=>(team===0)===(st.side===0)?"a":"b";
  function render(){
    if(st.phase==="side"){
      screen(head("سكورشيت",`فاضل ${ar(left("xi",XI))} ماتش`,"كل فريق بياخد فريقة من الماتش، وبالدور كل واحد يقول لاعب من التشكيلة الأساسية. صح = <b>نقطة</b>، غلط أو الوقت خلص = الدور يعدّي. عندك <b>١٥ ثانية</b> للاعب.")+
      `<div class="card stack center"><div class="big" style="font-size:clamp(28px,8vw,40px)">${esc(st.m.t)}</div>
       <p class="mut" style="margin:0">${esc(st.m.a[0])} ضد ${esc(st.m.b[0])}</p>
       <p style="margin:0;font-weight:800;color:var(--t1)">${tn(0)} ياخد مين؟</p>
       <div class="row"><button class="btn a" data-s="0">${esc(st.m.a[0])}</button><button class="btn a" data-s="1">${esc(st.m.b[0])}</button></div>
       <button class="btn" id="skip">ماتش تاني</button></div>`);
      app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{st.side=+b.dataset.s;st.phase="play";render();});
      document.getElementById("skip").onclick=Xi;
      return;
    }
    const all=[...st.got.a,...st.got.b].every(Boolean), finished=all||st.reveal;
    const col=team=>{const s=sideOf(team), m=st.m[s];
      return `<div><div class="colh ${ab(team)}">${esc(m[0])}<small>${tn(team)} · ${ar(st.got[s].filter(Boolean).length)}/١١</small></div><div class="list">
       ${m[1].map((p,k)=>{const g=st.got[s][k], open=g||st.reveal, active=!finished&&st.turn===team&&!g;
        return `<button class="li ${g?"done "+ab(team):""} ${!open&&!active?"dim":""}" data-t="${team}" data-k="${k}" ${active?"":"disabled"}><span class="r">${ar(k+1)}</span><span class="v">${open?esc(p):S.eye?`<span class="peek">${esc(p)}</span>`:"؟"}</span></button>`}).join("")}</div></div>`};
    screen(head("سكورشيت",esc(st.m.t))+
     `<div class="card stack">
      ${finished?`<p class="center" style="margin:0;font-weight:800">${all?"التشكيلتين اتقالوا كاملين!":"دي التشكيلات كاملة"}</p>`:`<div class="turn ${ab(st.turn)}">الدور على ${tn(st.turn)}: قول لاعب من ${esc(st.m[sideOf(st.turn)][0])}</div>
      ${timerHTML(15)}<div class="row"><button class="btn pri" id="go">ابدأ ١٥ ثانية</button><button class="btn bad" id="wrong">غلط، الدور يعدّي</button></div>`}
      <div>${eyeBtn()}</div>
      <div class="cols">${col(0)}${col(1)}</div>
      <p class="mut center" style="margin:0">الحكم يدوس على اسم اللاعب لما حد يقوله صح</p>
      <div class="row">${finished?`<button class="btn pri" id="nx">ماتش جديد</button>`:`<button class="btn" id="all">اكشف التشكيلات</button>`}</div></div>`);
    const $=id=>document.getElementById(id);
    const pass=()=>{const o=1-st.turn; if(!st.got[sideOf(o)].every(Boolean)) st.turn=o;};
    $("go")&&($("go").onclick=()=>startTimer(15,()=>{toast("الوقت خلص");pass();render();}));
    $("wrong")&&($("wrong").onclick=()=>{stopTimer();tone(200,.25,"sawtooth");pass();render();});
    $("all")&&($("all").onclick=()=>{stopTimer();st.reveal=true;render();});
    $("nx")&&($("nx").onclick=Xi);
    app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{stopTimer();const t=+b.dataset.t,k=+b.dataset.k;st.got[sideOf(t)][k]=true;addPts(t,1);pass();render();});
  }
  render();
}

home();
</script>

</body>
</html>
